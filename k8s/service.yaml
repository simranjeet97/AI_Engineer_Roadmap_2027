apiVersion: v1
kind: Service
metadata:
  name: apex-infer-service
  namespace: inference
  labels:
    app: apex-infer-vllm
spec:
  type: ClusterIP
  selector:
    app: apex-infer-vllm
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: apex-infer-headless
  namespace: inference
  labels:
    app: apex-infer-vllm
spec:
  clusterIP: None
  selector:
    app: apex-infer-vllm
  ports:
  - name: http
    port: 8000
    targetPort: 8000
