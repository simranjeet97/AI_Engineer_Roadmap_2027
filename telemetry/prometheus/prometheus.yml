global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 1s

scrape_configs:
  - job_name: 'vllm_engine'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:8000'
        labels:
          engine: 'vllm'
          cluster: 'production-us-east-1'

  - job_name: 'sglang_engine'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:30000'
        labels:
          engine: 'sglang'
          cluster: 'production-us-east-1'

  - job_name: 'disaggregated_prefill'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:8100'
        labels:
          role: 'prefill'
          cluster: 'production-disaggregated'

  - job_name: 'disaggregated_decode'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:8200'
        labels:
          role: 'decode'
          cluster: 'production-disaggregated'
